services:
  prod:
    build: .
    container_name: slumber_bridge
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always
  dev:
    build: .
    container_name: slumber_bridge_dev
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
